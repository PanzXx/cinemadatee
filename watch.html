<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CinemaDate 🎬 — Menonton Bersama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/watch.css" />
</head>
<body>

<div class="app-shell" id="appShell">

  <!-- ===================== TOPBAR ===================== -->
  <header class="topbar">
    <div class="topbar-logo">Cinema<em>Date</em> 🎬</div>

    <div class="topbar-status">
      <div class="status-pill" id="partnerStatus">
        <div class="status-dot" id="partnerDot"></div>
        <span id="partnerName">Menunggu pasangan...</span>
      </div>
      <div class="status-pill" id="movieTitlePill">
        🎞️ <span id="movieTitleText"></span>
      </div>
    </div>

    <div class="topbar-actions">
      <span class="badge-role" id="roleBadge">Penonton</span>
    </div>
  </header>

  <!-- ===================== VIDEO SECTION ===================== -->
  <section class="video-section">
    <div class="video-wrapper">
      <video id="mainVideo" preload="auto" playsinline></video>
      <div class="viewer-overlay" id="viewerOverlay"></div>

      <div class="sync-overlay" id="syncOverlay">
        <div class="sync-message">
          <div class="sync-spinner"></div>
          <h3>Menyinkronkan... ⏳</h3>
          <p>Mohon tunggu sebentar</p>
        </div>
      </div>

      <canvas id="heartCanvas"></canvas>
      <div class="reaction-toast" id="reactionToast"></div>
    </div>

    <!-- Video Controls -->
    <div class="video-controls">
      <div class="progress-container">
        <span id="timeCurrentDisplay">0:00</span>
        <div class="progress-bar-wrapper" id="progressBarWrapper">
          <div class="progress-fill" id="progressFill" style="width:0%">
            <div class="progress-thumb"></div>
          </div>
        </div>
        <span id="timeDurationDisplay">0:00</span>
      </div>

      <div class="controls-row">
        <button class="ctrl-btn play-btn" id="playPauseBtn" title="Putar / Jeda">▶</button>
        <button class="ctrl-btn" id="skipBackBtn" title="Mundur 10 detik">⏪ 10s</button>
        <button class="ctrl-btn" id="skipFwdBtn" title="Maju 10 detik">10s ⏩</button>

        <span class="volume-icon" style="font-size:1rem; opacity:0.6; flex-shrink:0;">🔊</span>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1" />

        <div class="spacer"></div>

        <div class="reaction-bar">
          <button class="reaction-btn" data-reaction="😂" title="Haha">😂</button>
          <button class="reaction-btn" data-reaction="😱" title="Kaget">😱</button>
          <button class="reaction-btn" data-reaction="😭" title="Terharu">😭</button>
          <button class="reaction-btn" data-reaction="🔥" title="Keren">🔥</button>
        </div>

        <button class="ctrl-btn" id="fullscreenBtn" title="Layar Penuh">⛶</button>
      </div>
    </div>
  </section>

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar">
    <div class="sidebar-tabs">
      <button class="tab-btn active" data-tab="chat">💬 Percakapan</button>
      <button class="tab-btn" data-tab="vibes">✨ Ekspresi</button>
    </div>

    <!-- CHAT PANEL -->
    <div class="tab-panel active" id="tab-chat">
      <!-- Chat header with clear options -->
      <div class="chat-header">
        <span class="chat-header-title">Pesan</span>
        <button class="chat-clear-btn" id="chatClearBtn" title="Hapus riwayat percakapan">
          Hapus Semua
        </button>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="typing-indicator" id="typingIndicator" style="display:none;">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <span style="margin-left:4px; font-size:0.75rem;">sedang mengetik...</span>
        </div>
      </div>

      <div class="chat-input-area">
        <textarea
          class="chat-input"
          id="chatInput"
          placeholder="Kirim pesan..."
          rows="1"
          maxlength="500"
        ></textarea>
        <button class="chat-send-btn" id="chatSendBtn">➤</button>
      </div>
    </div>

    <!-- VIBES PANEL -->
    <div class="tab-panel" id="tab-vibes">
      <div class="vibes-panel">

        <div>
          <p class="vibes-section-title">Kirim Cinta 💕</p>
          <button class="heart-btn-big" id="bigHeartBtn">
            <span class="heart-icon">❤️</span>
            <span>Kirim Hati</span>
          </button>
        </div>

        <div>
          <button class="popcorn-btn" id="popcornBtn">
            🍿 Minta Jeda Sebentar
          </button>
        </div>

        <div>
          <p class="vibes-section-title">Ekspresi Saat Ini</p>
          <!-- Emoji only, no text labels -->
          <div class="mood-grid">
            <button class="mood-btn" data-mood="😂" title="Tertawa">
              <span>😂</span>
            </button>
            <button class="mood-btn" data-mood="😭" title="Terharu">
              <span>😭</span>
            </button>
            <button class="mood-btn" data-mood="😱" title="Terkejut">
              <span>😱</span>
            </button>
            <button class="mood-btn" data-mood="🥰" title="Bahagia">
              <span>🥰</span>
            </button>
            <button class="mood-btn" data-mood="🔥" title="Keren">
              <span>🔥</span>
            </button>
            <button class="mood-btn" data-mood="💤" title="Mengantuk">
              <span>💤</span>
            </button>
          </div>
        </div>

        <div>
          <p class="vibes-section-title">Status Sinkronisasi</p>
          <div class="sync-status-box">
            <div class="sync-row">
              <span class="sync-label">Posisi Video</span>
              <span class="sync-value" id="syncPosDisplay">0:00</span>
            </div>
            <div class="sync-row">
              <span class="sync-label">Status</span>
              <span class="sync-value good" id="syncStatusDisplay">Tersinkron ✓</span>
            </div>
            <div class="sync-row">
              <span class="sync-label">Koneksi</span>
              <span class="sync-value good" id="connStatusDisplay">Online 🟢</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </aside>

</div>

<script type="module" src="js/watch.js"></script>

</body>
</html>
