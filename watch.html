<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>CinemaDate — Ruang Nonton</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/watch.css" />
</head>
<body>

<div class="app-shell" id="appShell">

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-logo">Cinema<em>Date</em></div>

    <div class="topbar-status">
      <div class="status-pill" id="partnerStatus">
        <div class="status-dot" id="partnerDot"></div>
        <span id="partnerName">Menunggu...</span>
      </div>
      <div class="status-pill" id="movieTitlePill">
        🎞️ <span id="movieTitleText"></span>
      </div>
    </div>

    <div class="topbar-actions">
      <span class="badge-role" id="roleBadge">Penonton</span>
    </div>
  </header>

  <!-- VIDEO SECTION -->
  <section class="video-section">
    <div class="video-wrapper">
      <video id="mainVideo" preload="auto" playsinline webkit-playsinline></video>
      <div class="viewer-overlay" id="viewerOverlay"></div>
      <div class="sync-overlay" id="syncOverlay">
        <div class="sync-message">
          <div class="sync-spinner"></div>
          <h3>Menyinkronkan Video...</h3>
          <p>Mohon tunggu sebentar</p>
        </div>
      </div>
      <canvas id="heartCanvas"></canvas>
      <div class="reaction-toast" id="reactionToast"></div>
    </div>

    <!-- Controls -->
    <div class="video-controls">
      <div class="progress-container">
        <span id="timeCurrentDisplay">0:00</span>
        <div class="progress-bar-wrapper" id="progressBarWrapper">
          <div class="progress-fill" id="progressFill" style="width:0%">
            <div class="progress-thumb"></div>
          </div>
        </div>
        <span id="timeDurationDisplay">0:00</span>
      </div>

      <div class="controls-row">
        <button class="ctrl-btn play-btn" id="playPauseBtn">▶</button>
        <button class="ctrl-btn" id="skipBackBtn">⏪ <span class="skip-label">10s</span></button>
        <button class="ctrl-btn" id="skipFwdBtn"><span class="skip-label">10s</span> ⏩</button>
        <span style="font-size:0.9rem;opacity:0.6;">🔊</span>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1" />
        <div class="spacer"></div>
        <div class="reaction-bar">
          <button class="reaction-btn" data-reaction="😂">😂</button>
          <button class="reaction-btn" data-reaction="😱">😱</button>
          <button class="reaction-btn" data-reaction="😭">😭</button>
          <button class="reaction-btn" data-reaction="🔥">🔥</button>
        </div>
        <button class="ctrl-btn" id="fullscreenBtn" title="Layar Penuh">⛶</button>
      </div>
    </div>
  </section>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-tabs">
      <button class="tab-btn active" data-tab="chat">💬 Obrolan</button>
      <button class="tab-btn" data-tab="vibes">✨ Ekspresi</button>
    </div>

    <!-- CHAT PANEL -->
    <div class="tab-panel active" id="tab-chat">
      <!-- Admin: clear all button -->
      <div class="chat-actions-bar" id="chatActionsBar" style="display:none;">
        <button class="clear-chat-btn" id="clearAllChatBtn">🗑 Hapus Semua Obrolan</button>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="typing-indicator" id="typingIndicator" style="display:none;">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <span style="margin-left:4px;font-size:0.75rem;">sedang mengetik...</span>
        </div>
      </div>

      <div class="chat-input-area">
        <textarea
          class="chat-input"
          id="chatInput"
          placeholder="Tulis pesan..."
          rows="1"
          maxlength="500"
        ></textarea>
        <button class="chat-send-btn" id="chatSendBtn">➤</button>
      </div>
    </div>

    <!-- VIBES PANEL -->
    <div class="tab-panel" id="tab-vibes">
      <div class="vibes-panel">
        <div>
          <p class="vibes-section-title">Tebar Kasih Sayang</p>
          <button class="heart-btn-big" id="bigHeartBtn">
            <span class="heart-icon">❤️</span>
            <span>Kirim Hati</span>
          </button>
        </div>

        <div>
          <button class="popcorn-btn" id="popcornBtn">
            🍿 Minta Jeda Sebentar
          </button>
        </div>

        <div>
          <p class="vibes-section-title">Ekspresi Perasaan</p>
          <div class="mood-grid">
            <button class="mood-btn" data-mood="😂">😂</button>
            <button class="mood-btn" data-mood="😭">😭</button>
            <button class="mood-btn" data-mood="😱">😱</button>
            <button class="mood-btn" data-mood="🥰">🥰</button>
            <button class="mood-btn" data-mood="🔥">🔥</button>
            <button class="mood-btn" data-mood="💤">💤</button>
          </div>
        </div>

        <div>
          <p class="vibes-section-title">Status Sinkronisasi</p>
          <div class="sync-status-box">
            <div class="sync-row">
              <span class="sync-label">Posisi Video</span>
              <span class="sync-value" id="syncPosDisplay">0:00</span>
            </div>
            <div class="sync-row">
              <span class="sync-label">Sinkronisasi</span>
              <span class="sync-value good" id="syncStatusDisplay">Tersinkron ✓</span>
            </div>
            <div class="sync-row">
              <span class="sync-label">Koneksi</span>
              <span class="sync-value good" id="connStatusDisplay">Online 🟢</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </aside>
</div>

<!-- Context Menu (delete message) -->
<div id="ctxMenu" class="msg-context-menu" style="display:none;position:fixed;">
  <button class="context-menu-item" id="ctxDeleteForMe">🙈 Hapus untuk Saya</button>
  <div class="context-menu-divider" id="ctxDivider"></div>
  <button class="context-menu-item danger" id="ctxDeleteForAll">🗑 Hapus untuk Semua</button>
</div>

<!-- Confirm Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">Konfirmasi</div>
    <div class="modal-desc" id="modalDesc">Apakah Anda yakin?</div>
    <div class="modal-actions">
      <button class="modal-btn" id="modalCancel">Batal</button>
      <button class="modal-btn danger" id="modalConfirm">Hapus</button>
    </div>
  </div>
</div>

<script type="module" src="js/watch.js"></script>
</body>
</html>
